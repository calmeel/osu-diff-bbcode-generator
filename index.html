<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>osu! Diff BBCode Generator</title>

  <link rel="stylesheet" href="style.css" />

  <!-- d3 interpolate -->
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
</head>
<body>

  <div class="container">
    <header class="app-header">
      <div>
        <h1 data-i18n="appTitle">osu! Diff BBCode Generator</h1>

        <div class="credits">
          <span data-i18n="programCreditLabel">Program</span>:
          <a href="https://osu.ppy.sh/users/12029122" target="_blank" rel="noopener">Vanity8</a>
          <span class="credit-separator">/</span>
          <span data-i18n="planningCreditLabel">Planning</span>:
          <a href="https://osu.ppy.sh/users/9346502" target="_blank" rel="noopener">Santi199</a>
        </div>

        <div class="last-updated">
          <span data-i18n="lastUpdatedLabel">Last updated</span>: 2026-05-26
        </div>
      </div>

      <nav class="header-actions" aria-label="Project links">
        <div class="language-toggle" role="group" aria-label="Language">
          <button type="button" class="language-btn is-active" data-language="en">EN</button>
          <button type="button" class="language-btn" data-language="ja">JA</button>
        </div>
        <a class="header-link" href="https://github.com/calmeel/osu-diff-bbcode-generator" target="_blank" rel="noopener">GitHub</a>
        <a class="header-link" href="docs/color-table.html" target="_blank" rel="noopener" data-i18n="colorTableLink">Color table</a>
      </nav>
    </header>

    <div class="input-section">
      <input
        type="text"
        id="beatmap-url"
        placeholder="https://osu.ppy.sh/beatmapsets/2552409#taiko/5663322"
        aria-label="Beatmapset URL"
      />

      <button id="generate-btn" data-i18n="generateButton">
        Generate BBCode
      </button>
    </div>

    <div class="options-panel" aria-label="BBCode options">
      <input type="hidden" id="language" value="en" />

      <div class="options-title" data-i18n="optionsLabel">Options</div>

      <label class="select-option">
        <span data-i18n="textColorModeLabel">Difficulty text color</span>
        <select id="text-color-mode">
          <option value="readable-sr" data-i18n="textColorReadableSr">Readable SR color</option>
          <option value="sr" data-i18n="textColorSr">SR color</option>
          <option value="white" data-i18n="textColorWhite">White</option>
          <option value="osu-text" data-i18n="textColorOsuText">osu! text color</option>
        </select>
      </label>

      <label class="checkbox-option">
        <input type="checkbox" id="show-host-as-me" checked />
        <span data-i18n="showHostAsMeLabel">Show host diffs as by me</span>
      </label>

      <label class="checkbox-option">
        <input type="checkbox" id="strip-guest-owner-prefix" />
        <span data-i18n="stripGuestOwnerPrefixLabel">Hide guest name prefix in diff names</span>
      </label>

    </div>

    <div class="section">
      <h2 data-i18n="previewHeading">Preview</h2>
      <div id="preview"></div>
    </div>

    <div class="section">
      <h2 data-i18n="bbcodeHeading">BBCode</h2>

      <textarea id="bbcode-output" readonly></textarea>

      <button id="copy-btn" data-i18n="copyButton">
        Copy
      </button>
    </div>

    <div class="section">
      <h2 data-i18n="statusHeading">Status</h2>
      <div id="status">
        Ready.
      </div>
    </div>
  </div>

  <script src="script.js"></script>

</body>
</html>
