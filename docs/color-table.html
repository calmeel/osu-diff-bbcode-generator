<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>osu! SR Color Table</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      background: #111419;
      color: #eef2f8;
      font-family: Arial, sans-serif;
      font-size: 12px;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-size: 20px;
    }

    .mode-toggle {
      display: flex;
      gap: 4px;
      padding: 3px;
      background: #1b1f27;
      border: 1px solid #333b49;
      border-radius: 8px;
    }

    .mode-button {
      min-width: 58px;
      min-height: 32px;
      padding: 7px 10px;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: #c8ced8;
      cursor: pointer;
      font-size: 12px;
      line-height: 1.2;
    }

    .mode-button.is-active {
      background: #4c6fff;
      color: #ffffff;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th,
    td {
      border: 1px solid #303743;
      padding: 5px 7px;
      text-align: left;
      vertical-align: middle;
      line-height: 1.25;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: #1b1f27;
      color: #ffffff;
      font-weight: bold;
    }

    tr:nth-child(even) td {
      background: #141922;
    }

    tr:nth-child(odd) td {
      background: #11161d;
    }

    .icon-cell {
      width: 48px;
      text-align: center;
    }

    .color-cell {
      width: 170px;
    }

    .bbcode-cell {
      width: 48%;
    }

    .icon-preview {
      width: 16px;
      height: 16px;
      vertical-align: middle;
    }

    .swatch {
      display: inline-block;
      width: 42px;
      height: 12px;
      margin-right: 6px;
      border: 1px solid rgba(255, 255, 255, 0.24);
      border-radius: 3px;
      vertical-align: middle;
    }

    .badge {
      display: inline-block;
      min-width: 76px;
      padding: 2px 7px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: bold;
      line-height: 1.3;
    }

    .sr-badge-cell {
      width: 138px;
      text-align: center;
    }

    code {
      color: #e3e7ef;
      font-family: Consolas, monospace;
      font-size: 11px;
      overflow-wrap: anywhere;
    }

    @media (max-width: 860px) {
      body {
        padding: 10px;
      }

      table {
        table-layout: auto;
      }

      .sr-badge-cell {
        width: 110px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>osu! SR Color Table</h1>
    <div class="mode-toggle" role="group" aria-label="Mode">
      <button type="button" class="mode-button is-active" data-mode="std">std</button>
      <button type="button" class="mode-button" data-mode="taiko">taiko</button>
      <button type="button" class="mode-button" data-mode="catch">catch</button>
      <button type="button" class="mode-button" data-mode="mania">mania</button>
    </div>
  </header>

  <table>
    <thead>
      <tr>
        <th class="sr-badge-cell">SR</th>
        <th class="icon-cell">Icon</th>
        <th class="color-cell">BG HEX Code</th>
        <th class="color-cell">Text HEX Code</th>
        <th class="bbcode-cell">BBCode image</th>
      </tr>
    </thead>
    <tbody id="color-table-body"></tbody>
  </table>

  <script>
    const BASE_ICON_URL = "https://calmeel.github.io/osu-diff-bbcode-generator/assets/i";
    const LOCAL_ICON_URL = "../assets/i";
    const MAX_ICON_SR = 9;
    const MAX_TABLE_SR = 15;

    const DIFFICULTY_COLOUR_STOPS = [
      [0.1, "#4290FB"],
      [1.25, "#4FC0FF"],
      [2, "#4FFFD5"],
      [2.5, "#7CFF4F"],
      [3.3, "#F6F05C"],
      [4.2, "#FF8068"],
      [4.9, "#FF4E6F"],
      [5.8, "#C645B8"],
      [6.7, "#6563DE"],
      [7.7, "#18158E"],
      [9, "#000000"],
    ];

    const DIFFICULTY_TEXT_COLOUR_STOPS = [
      [9, "#F6F05C"],
      [9.9, "#FF8068"],
      [10.6, "#FF4E6F"],
      [11.5, "#C645B8"],
      [12.4, "#6563DE"],
    ];

    let selectedMode = "std";

    for (const button of document.querySelectorAll(".mode-button")) {
      button.addEventListener("click", () => {
        selectedMode = button.dataset.mode;
        updateModeButtons();
        renderTable();
      });
    }

    renderTable();

    function updateModeButtons() {
      for (const button of document.querySelectorAll(".mode-button")) {
        button.classList.toggle("is-active", button.dataset.mode === selectedMode);
      }
    }

    function renderTable() {
      const body = document.getElementById("color-table-body");
      const fragment = document.createDocumentFragment();

      body.innerHTML = "";

      for (let value = 0; value <= MAX_TABLE_SR * 100; value += 1) {
        fragment.appendChild(createRow(value / 100));
      }

      body.appendChild(fragment);
    }

    function createRow(sr) {
      const row = document.createElement("tr");
      const srText = sr.toFixed(2);
      const iconSr = Math.min(sr, MAX_ICON_SR).toFixed(2);
      const bgColor = getDiffColour(sr);
      const textColor = getDiffTextColour(sr);
      const localIconUrl = `${LOCAL_ICON_URL}/${selectedMode}/${iconSr}.png`;
      const absoluteIconUrl = `${BASE_ICON_URL}/${selectedMode}/${iconSr}.png`;

      row.append(
        createBadgeCell(srText, bgColor, textColor),
        createIconCell(localIconUrl),
        createColorCell(bgColor),
        createColorCell(textColor),
        createCodeCell(`[img]${absoluteIconUrl}[/img]`),
      );

      return row;
    }

    function createIconCell(iconUrl) {
      const cell = document.createElement("td");
      const icon = document.createElement("img");
      cell.className = "icon-cell";
      icon.className = "icon-preview";
      icon.src = iconUrl;
      icon.alt = "";
      cell.appendChild(icon);
      return cell;
    }

    function createColorCell(color) {
      const cell = document.createElement("td");
      const swatch = document.createElement("span");
      const code = document.createElement("code");

      cell.className = "color-cell";
      swatch.className = "swatch";
      swatch.style.backgroundColor = color;
      code.textContent = color;
      cell.append(swatch, code);

      return cell;
    }

    function createCodeCell(value) {
      const cell = document.createElement("td");
      const code = document.createElement("code");

      cell.className = "bbcode-cell";
      code.textContent = value;
      cell.appendChild(code);

      return cell;
    }

    function createBadgeCell(srText, bgColor, textColor) {
      const cell = document.createElement("td");
      const badge = document.createElement("span");

      cell.className = "sr-badge-cell";
      badge.className = "badge";
      badge.style.backgroundColor = bgColor;
      badge.style.color = textColor;
      badge.textContent = `★ ${srText}`;
      cell.appendChild(badge);

      return cell;
    }

    function getDiffColour(rating) {
      if (rating < 0.1) {
        return "#AAAAAA";
      }

      if (rating >= 9) {
        return "#000000";
      }

      return scaleColour(rating, DIFFICULTY_COLOUR_STOPS);
    }

    function getDiffTextColour(rating) {
      if (rating < 6.5) {
        return "#000000";
      }

      if (rating < 9) {
        return "#F6F05C";
      }

      return scaleColour(rating, DIFFICULTY_TEXT_COLOUR_STOPS);
    }

    function scaleColour(rating, stops) {
      if (rating <= stops[0][0]) {
        return stops[0][1];
      }

      if (rating >= stops[stops.length - 1][0]) {
        return stops[stops.length - 1][1];
      }

      for (let index = 1; index < stops.length; index += 1) {
        const [stopRating, stopColour] = stops[index];
        const [previousRating, previousColour] = stops[index - 1];

        if (rating <= stopRating) {
          const amount = (rating - previousRating) / (stopRating - previousRating);
          return rgbToHex(interpolateRgbGamma(
            hexToRgb(previousColour),
            hexToRgb(stopColour),
            amount,
          ));
        }
      }

      return stops[stops.length - 1][1];
    }

    function interpolateRgbGamma(start, end, amount, gamma = 2.2) {
      return start.map((startValue, index) => {
        const endValue = end[index];
        const startGamma = (startValue / 255) ** gamma;
        const endGamma = (endValue / 255) ** gamma;
        const interpolated = startGamma + (endGamma - startGamma) * amount;
        return Math.round((interpolated ** (1 / gamma)) * 255);
      });
    }

    function hexToRgb(value) {
      const hex = value.replace("#", "");
      return [0, 2, 4].map(index => parseInt(hex.slice(index, index + 2), 16));
    }

    function rgbToHex(rgb) {
      return `#${rgb.map(value => value.toString(16).padStart(2, "0")).join("")}`;
    }
  </script>
</body>
</html>
